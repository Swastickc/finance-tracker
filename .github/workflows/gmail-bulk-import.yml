name: Gmail bulk historical import

# Manually triggered — this is a one-time historical backfill, not something
# that should run on every push. Runs on GitHub's runners (no corporate
# proxy issues, no dependency on any local machine, up to 6h execution time).
on:
  workflow_dispatch: {}

jobs:
  bulk-import:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm ci

      - name: Run bulk Gmail import
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GOOGLE_SHEETS_CLIENT_EMAIL: ${{ secrets.GOOGLE_SHEETS_CLIENT_EMAIL }}
          GOOGLE_SHEETS_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_PRIVATE_KEY }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_GMAIL_IMPORT_RANGE: ${{ secrets.GOOGLE_SHEETS_GMAIL_IMPORT_RANGE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/gmail-bulk-import.ts

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gmail-bulk-import-summary
          path: data/gmail-bulk-import-summary.json
          if-no-files-found: ignore
